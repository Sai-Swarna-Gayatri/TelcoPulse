spring.application.name=telcopulse


##Actuator Settings
management.endpoints.web.exposure.include=health,info,metrics,loggers,beans,mappings
management.info.env.enabled=true
info.app.name=telcopulse
info.app.version=1.0.0
info.app.description=Subscriber management API

#Logger Setting
logging.level.com.ssg.telcopulse=DEBUG
logging.file.name=logs/subscriber.log

#Database Settings
# H2 Database URL (In-Memory)
spring.datasource.url=jdbc:h2:mem:telcopulsedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate & JPA Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Enable H2 Web Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

